
name: Build Upstox Instruments

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build instrument list
        run: |
          cat > build_instruments.py <<'PY'
          import gzip
          import json
          import urllib.request
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          URL = "https://assets.upstox.com/market-quote/instruments/exchange/complete.json.gz"
          TODAY = datetime.now(ZoneInfo("Asia/Kolkata")).date().isoformat()

          req = urllib.request.Request(
              URL,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=120) as response:
              raw = response.read()

          try:
              raw = gzip.decompress(raw)
          except (gzip.BadGzipFile, OSError):
              pass

          data = json.loads(raw.decode("utf-8-sig"))

          if isinstance(data, dict):
              data = data.get("data", [])

          if not isinstance(data, list) or not data:
              raise RuntimeError(
                  "Instrument master is empty or has an unexpected format"
              )

          def val(row, *keys):
              for key in keys:
                  value = row.get(key)
                  if value not in (None, ""):
                      return value
              return ""

          def upper(row, *keys):
              return str(val(row, *keys)).strip().upper()

          def expiry_key(row):
              value = val(row, "expiry")

              if not value:
                  return "9999-12-31"

              text_value = str(value).strip()

              try:
                  number = int(float(text_value))

                  if number > 10**12:
                      number //= 1000

                  if number > 10**9:
                      return datetime.fromtimestamp(
                          number, timezone.utc
                      ).date().isoformat()
              except (ValueError, TypeError, OSError, OverflowError):
                  pass

              try:
                  return datetime.fromisoformat(
                      text_value.replace("Z", "+00:00")
                  ).date().isoformat()
              except ValueError:
                  return text_value[:10]

          def normalized(row):
              return {
                  "symbol": str(val(
                      row, "trading_symbol", "underlying_symbol"
                  )),
                  "name": str(val(row, "name", "trading_symbol")),
                  "exchange": str(val(row, "exchange")),
                  "instrument_key": str(val(row, "instrument_key")),
                  "segment": str(val(row, "segment")),
                  "type": str(val(row, "instrument_type")),
                  "lot_size": val(row, "lot_size"),
                  "tick_size": val(row, "tick_size"),
                  "expiry": str(val(row, "expiry")),
                  "underlying": str(val(row, "underlying_symbol")),
              }

          # 1. NSE stock futures only. Exclude index futures.
          stock_futures = [
              r for r in data
              if upper(r, "segment") == "NSE_FO"
              and upper(r, "instrument_type") == "FUTSTK"
              and upper(r, "underlying_symbol")
              and val(r, "instrument_key")
              and expiry_key(r) >= TODAY
          ]

          # 2. Select nearest unexpired contract per stock.
          nearest_stock_future = {}

          for r in stock_futures:
              symbol = upper(r, "underlying_symbol")

              if (
                  symbol not in nearest_stock_future
                  or expiry_key(r) < expiry_key(
                      nearest_stock_future[symbol]
                  )
              ):
                  nearest_stock_future[symbol] = r

          # 3. Find corresponding NSE cash-equity instruments.
          equities = {}

          eligible_symbols = set(nearest_stock_future.keys())

          for r in data:
              if (
                  upper(r, "segment") == "NSE_EQ"
                  and upper(r, "instrument_type") == "EQ"
              ):
                  symbol = upper(r, "trading_symbol")

                  if (
                      symbol in eligible_symbols
                      and val(r, "instrument_key")
                  ):
                      equities[symbol] = r

          stocks = []

          for symbol in sorted(eligible_symbols):
              r = equities.get(symbol)

              if not r:
                  continue

              item = normalized(r)
              item["symbol"] = symbol
              item["name"] = str(val(r, "name", "trading_symbol"))
              item["category"] = "NSE_FO_STOCK"
              item["underlying"] = symbol
              stocks.append(item)

          # 4. Save nearest stock futures separately for OI calculation.
          stock_futures_current_month = []

          for symbol in sorted(nearest_stock_future):
              r = nearest_stock_future[symbol]

              item = normalized(r)
              item["symbol"] = symbol
              item["name"] = str(
                  val(r, "name", "trading_symbol", "underlying_symbol")
              )
              item["category"] = "NSE_STOCK_FUTURE"
              item["underlying"] = symbol
              stock_futures_current_month.append(item)

          # 5. Cash indices only. No index option contracts.
          indices = []

          for r in data:
              if (
                  upper(r, "segment") == "NSE_INDEX"
                  and upper(r, "instrument_type") == "INDEX"
                  and val(r, "instrument_key")
              ):
                  item = normalized(r)
                  item["category"] = "INDEX"
                  indices.append(item)

          # 6. Nearest unexpired MCX futures per underlying.
          mcx = [
              r for r in data
              if upper(r, "segment") == "MCX_FO"
              and upper(r, "instrument_type") == "FUTCOM"
              and val(r, "instrument_key")
              and expiry_key(r) >= TODAY
          ]

          nearest_mcx = {}

          for r in mcx:
              key = upper(r, "underlying_symbol", "trading_symbol")

              if not key:
                  continue

              if (
                  key not in nearest_mcx
                  or expiry_key(r) < expiry_key(nearest_mcx[key])
              ):
                  nearest_mcx[key] = r

          commodities = []

          for key in sorted(nearest_mcx):
              item = normalized(nearest_mcx[key])
              item["symbol"] = key
              item["category"] = "MCX_FUTURE"
              item["underlying"] = key
              commodities.append(item)

          # 7. Final output.
          output = {
              "source": URL,
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "counts": {
                  "nse_fo_stocks": len(stocks),
                  "nse_stock_futures": len(stock_futures_current_month),
                  "indices": len(indices),
                  "mcx_futures": len(commodities),
              },
              "instruments": (
                  stocks
                  + indices
                  + commodities
              ),
              "stock_futures_current_month": stock_futures_current_month,
          }

          # 8. Diagnostics.
          print("Raw records:", len(data))
          print("NSE stock futures contracts found:", len(stock_futures))
          print(
              "Current month stock futures:",
              len(stock_futures_current_month)
          )
          print("Output counts:", json.dumps(output["counts"]))

          print("Sample current month stock futures:")

          for item in stock_futures_current_month[:5]:
              print(json.dumps(item, ensure_ascii=False))

          if not stocks:
              raise RuntimeError("No NSE F&O equity instruments found")

          if not stock_futures_current_month:
              raise RuntimeError(
                  "No NSE stock futures found. Check Upstox master schema."
              )

          if not indices:
              raise RuntimeError("No NSE cash indices found")

          if not commodities:
              raise RuntimeError("No unexpired MCX futures found")

          with open("instruments.json", "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

          print("Total main instruments:", len(output["instruments"]))
          print(
              "Total stock futures mapping:",
              len(output["stock_futures_current_month"])
          )
          print("UNIVERSE BUILD SUCCESS")
          PY

          python build_instruments.py
          python -m json.tool instruments.json > /dev/null

      - name: Commit generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instruments.json
          git diff --cached --quiet || git commit -m "Update Upstox instruments"
          git push
